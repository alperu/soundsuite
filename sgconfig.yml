# ast-grep project config. Run from repo root: `ast-grep run -p '<pattern>' -l ts`
# Rules live in .ast-grep/rules; tests in .ast-grep/tests.
ruleDirs:
  - .ast-grep/rules
testConfigs:
  - testDir: .ast-grep/tests
languageGlobs:
  typescript: ["*.ts", "*.mts", "*.cts"]
  tsx: ["*.tsx"]
  javascript: ["*.js", "*.mjs", "*.cjs"]

# Custom tree-sitter languages. Dylibs built from ~/Code/mcpfantom/tree-sitter-{fantom,axon,xeto}:
#   cc -shared -fPIC -O2 -I <g>/src <g>/src/parser.c [<g>/src/scanner.c] -o ~/.ast-grep/parsers/<lang>.dylib
customLanguages:
  fantom:
    libraryPath: /Users/alper/.ast-grep/parsers/fantom.dylib
    extensions: [fan, fwt]
    expandoChar: _
  axon:
    libraryPath: /Users/alper/.ast-grep/parsers/axon.dylib
    extensions: [axon, trio]
    expandoChar: _
  xeto:
    libraryPath: /Users/alper/.ast-grep/parsers/xeto.dylib
    extensions: [xeto]
    expandoChar: _
