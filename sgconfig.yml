# ast-grep project config. Run from repo root: `ast-grep run -p '<pattern>' -l ts`
# Rules live in .ast-grep/rules; tests in .ast-grep/tests.
ruleDirs:
  - .ast-grep/rules
testConfigs:
  - testDir: .ast-grep/tests
languageGlobs:
  typescript: ["*.ts", "*.mts", "*.cts"]
  tsx: ["*.tsx"]
  javascript: ["*.js", "*.mjs", "*.cjs"]

# Custom tree-sitter languages. Dylibs built from ~/Code/mcpfantom/tree-sitter-{fantom,axon,xeto,trio}:
#   cc -shared -fPIC -O2 -I <g>/src <g>/src/parser.c [<g>/src/scanner.c] -o ~/.ast-grep/parsers/<lang>.dylib
customLanguages:
  fantom:
    libraryPath: /Users/alper/.ast-grep/parsers/fantom.dylib
    extensions: [fan, fwt]
    expandoChar: _
  axon:
    libraryPath: /Users/alper/.ast-grep/parsers/axon.dylib
    extensions: [axon]
    expandoChar: _
  trio:
    libraryPath: /Users/alper/.ast-grep/parsers/trio.dylib
    extensions: [trio]
    expandoChar: _
  xeto:
    libraryPath: /Users/alper/.ast-grep/parsers/xeto.dylib
    extensions: [xeto]
    expandoChar: _

# Axon source inside the `src:` block of a Trio function record.
# `ast-grep run -l axon ...` then also searches *.trio files.
languageInjections:
  - hostLanguage: trio
    rule:
      kind: indented_text
      pattern: $CONTENT
      inside:
        kind: block_tag
        has:
          field: name
          regex: '^src$'
    injected: axon
