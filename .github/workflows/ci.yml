name: CI

# Build + test on every PR and push to main. Fast app-level feedback; the
# Dockerfile build is validated separately by docker-publish.yml on PRs.

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Prisma client (driver-adapter mode) is generated from schema +
      # prisma.config.ts; build and tests import it.
      - name: Generate Prisma client
        run: npx prisma generate

      # Jest suite. Informational for now (continue-on-error) so a single
      # environment-sensitive test doesn't block PRs; tighten once hardened.
      - name: Test
        run: npm test
        continue-on-error: true

      # Production build. Several route modules open a SQLite connection at
      # import time, so point DATABASE_URL at a throwaway path (mirrors the
      # Dockerfile builder stage — this DB is never used at runtime).
      - name: Build
        env:
          DATABASE_URL: file:/tmp/ci-build.db
          REDIS_URL: redis://localhost:6379
          NEXT_TELEMETRY_DISABLED: "1"
        run: |
          mkdir -p /tmp
          npm run build
