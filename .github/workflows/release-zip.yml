name: Release Zip

# On a semver tag (vX.Y.Z): create a GitHub Release and attach a buildable zip
# of the Docker build context. This is the archive users download to build their
# own image (`docker build` / `docker compose up`). See docs/ci-cd.md.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # create releases + upload assets

jobs:
  release-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for the tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive version
        id: ver
        run: |
          TAG="${GITHUB_REF_NAME}"           # e.g. v1.4.2
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build source zip
        id: zip
        run: |
          set -euo pipefail
          NAME="soundsuite-${{ steps.ver.outputs.version }}"
          # git archive ships only tracked files (gitignored data/, .next,
          # node_modules, public/exhibits, marketing/ are already absent).
          # Strip directories that aren't part of the main-app build context.
          git archive --format=zip --prefix="${NAME}/" -o "${NAME}.zip" "${GITHUB_REF_NAME}"
          # Remove sideCar/ (separate image) and bulky docs/marketing if present.
          zip -q -d "${NAME}.zip" "${NAME}/sideCar/*" || true
          zip -q -d "${NAME}.zip" "${NAME}/marketing/*" || true
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "file=${NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: Verify zip contains the build essentials
        run: |
          set -euo pipefail
          NAME="${{ steps.zip.outputs.name }}"
          ZIP="${{ steps.zip.outputs.file }}"
          for f in Dockerfile docker-compose.yml .dockerignore docker/entrypoint.sh \
                   package.json package-lock.json next.config.ts tsconfig.json \
                   prisma/schema.prisma prisma.config.ts; do
            unzip -l "$ZIP" | grep -q "${NAME}/${f}" || { echo "MISSING: $f"; exit 1; }
          done
          unzip -l "$ZIP" | grep -q "${NAME}/sideCar/" && { echo "sideCar/ leaked into zip"; exit 1; } || true
          echo "Zip contents validated."

      - name: Create GitHub Release and upload zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Sound Suite ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: ${{ steps.zip.outputs.file }}
          body: |
            ## Sound Suite ${{ steps.ver.outputs.version }}

            ### Run with the prebuilt image (GHCR)
            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/soundsuite:${{ steps.ver.outputs.version }}
            ```

            ### Build it yourself from the attached zip
            ```bash
            unzip soundsuite-${{ steps.ver.outputs.version }}.zip
            cd soundsuite-${{ steps.ver.outputs.version }}
            docker build -t soundsuite:${{ steps.ver.outputs.version }} .
            # or: docker compose up
            ```

            amd64-only in this release (arm64 is a follow-up — see docs/ci-cd.md).
